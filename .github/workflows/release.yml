name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Upload Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify tag matches package.json version
        run: node scripts/check-tag-version.mjs "$GITHUB_REF_NAME"

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Package and Generate Checksum
        id: build
        run: |
          VERSION_TAG=${GITHUB_REF_NAME}
          OUTPUT_FILE="pomelo-${VERSION_TAG}.tar.gz"
          
          echo "Building package: $OUTPUT_FILE"
          
          chmod +x ./scripts/package.sh
          ./scripts/package.sh "$OUTPUT_FILE"
          
          # Generate SHA256 checksum
          CHECKSUM_HASH=$(sha256sum "$OUTPUT_FILE" | awk '{print $1}')
          
          # Prepare release notes with the checksum
          echo "### Checksums" > release_notes.md
          echo "| Asset | SHA-256 |" >> release_notes.md
          echo "|-------|---------|" >> release_notes.md
          echo "| \`$OUTPUT_FILE\` | \`$CHECKSUM_HASH\` |" >> release_notes.md
          
          echo "output_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.output_file }}
          body_path: release_notes.md
          append_body: true
          generate_release_notes: true
