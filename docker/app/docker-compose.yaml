# Bind mounts resolve against ${POMELO_ROOT}, which the daemon sets from its own
# install root (APP_ROOT at install time). Keep the default in sync with
# scripts/install.sh and admin/src/daemon/core/dev.ts.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    profiles: ["internal-db"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ${POMELO_ROOT:-/opt/pomelo}/data/database/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - PORT=8080
      - AUTH_SECRET=${AUTH_SECRET}
      - JUDGE0_URL=${JUDGE0_URL}
      - DOMAIN=${DOMAIN}
      - PROTOCOL=${PROTOCOL:-http}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    volumes:
      - ${POMELO_ROOT:-/opt/pomelo}/data:/app/data
      - ${POMELO_ROOT:-/opt/pomelo}/config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${PROTOCOL:-http}://${DOMAIN}
      - DOMAIN=${DOMAIN}
      - PROTOCOL=${PROTOCOL:-http}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ${POMELO_ROOT:-/opt/pomelo}/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${POMELO_ROOT:-/opt/pomelo}/runtime/logs:/var/log/caddy
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
