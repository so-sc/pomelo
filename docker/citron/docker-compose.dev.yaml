x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  citron:
    image: justmodo/citron:latest
    command: ["citron", "-config", "/opt/citron/configs/citron.conf", "-address", "0.0.0.0:2358"]
    ports:
      - "127.0.0.1:2358:2358"
    cap_add: [SYS_ADMIN]
    security_opt:
      - apparmor=unconfined
      # Required: nsjail mounts a fresh /proc per run, which Docker's masked /proc paths block.
      # It widens the host attack surface, so keep Citron off networks it doesn't need.
      - systempaths=unconfined
    cgroup: private
    tmpfs:
      - /box:size=2g,mode=1777,exec
    volumes:
      - ./config/citron/citron.conf:/opt/citron/configs/citron.conf:ro
      - ./config/citron/languages.toml:/opt/citron/configs/languages.toml:ro
    <<: *default-logging
    restart: unless-stopped
